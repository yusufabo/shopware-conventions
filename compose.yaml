# Portable development setup: works on a fresh clone with `docker compose up -d`.
# No local files, certificates or external networks are required.
#
#   Shop:     http://localhost:8000        (admin: http://localhost:8000/admin)
#   Adminer:  http://localhost:9080        (server: database, user: root, password: root)
#   Mailpit:  http://localhost:8025
#
# Optional local overrides can be put into .env.local (not committed).

services:
    web:
        image: ghcr.io/shopware/docker-dev:php8.5-node24-caddy
        env_file:
            - path: .env.local
              required: false
        environment:
            HOST: 0.0.0.0
            APP_ENV: dev
            APP_URL: http://localhost:8000
            # Development-only value, never use it in production
            APP_SECRET: 8f6e3b1c2d4a5f7e9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a
            DATABASE_URL: mysql://root:root@database/shopware
            MAILER_DSN: smtp://mailer:1025
            LOCK_DSN: flock
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/html
        depends_on:
            database:
                condition: service_healthy

    database:
        image: mariadb:11.8
        command:
            - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
            - --log_bin_trust_function_creators=1
            - --binlog_cache_size=16M
            - --key_buffer_size=0
            - --join_buffer_size=1024M
            - --innodb_log_file_size=128M
            - --innodb_buffer_pool_size=1024M
            - --innodb_buffer_pool_instances=1
            - --group_concat_max_len=320000
            - --default-time-zone=+00:00
            - --max_binlog_size=512M
            - --binlog_expire_logs_seconds=86400
        environment:
            MARIADB_DATABASE: shopware
            MARIADB_ROOT_PASSWORD: root
            MARIADB_USER: shopware
            MARIADB_PASSWORD: shopware
        ports:
            # Fixed host port, so bin/console on the host can connect (DATABASE_URL in .env.local)
            - "127.0.0.1:33306:3306"
        volumes:
            - db-data:/var/lib/mysql:rw
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            start_period: 10s
            start_interval: 3s
            interval: 5s
            timeout: 5s
            retries: 20

    adminer:
        image: adminer
        environment:
            ADMINER_DEFAULT_SERVER: database
        ports:
            - "9080:8080"
        depends_on:
            database:
                condition: service_started

    mailer:
        image: axllent/mailpit
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
            - "8025:8025"

volumes:
    db-data: {}
